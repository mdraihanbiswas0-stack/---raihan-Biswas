name: Build Android APK (Calcu-Flow)

# কখন চলবে: main-এ push করলে, ম্যানুয়ালি (Actions → Run workflow), অথবা v* ট্যাগ দিলে
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}

    steps:
